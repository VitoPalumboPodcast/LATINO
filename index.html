<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LATINO INCLUSIVO</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0284c7;--green:#16a34a;--orange:#ea580c;--slate:#1e293b;--muted:#64748b;--soft:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--soft);font-family:Fredoka,Arial,sans-serif;color:var(--slate);text-transform:uppercase}header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:4px solid #e2e8f0;box-shadow:0 8px 20px #0001}.bar{max-width:1080px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.stars{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700}.starbox{background:#facc15;color:white;border-radius:18px;padding:8px 12px;box-shadow:0 8px 16px #facc1540}h1{margin:0;color:#94a3b8;font-size:clamp(22px,5vw,34px);text-align:center}.reset{border:0;border-radius:18px;padding:12px 15px;background:#f1f5f9;color:#64748b;font:inherit;font-weight:700}main{max-width:1080px;margin:auto;padding:28px 18px 46px}.screen{display:grid;gap:24px}.hero{text-align:center}.hero h2{margin:0 0 10px;font-size:clamp(34px,7vw,58px);line-height:1;color:#172033}.hero p{margin:0;color:var(--muted);font-size:clamp(20px,4vw,28px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;align-items:stretch}.card{background:white;border-radius:30px;padding:24px;box-shadow:0 16px 35px #0001;border-bottom:8px solid #e2e8f0;overflow:hidden}.word{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;align-items:center}.emoji{font-size:58px;line-height:1;text-align:center}.title{font-size:clamp(27px,3vw,32px);font-weight:700;color:#172033;margin-bottom:14px;text-align:center}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:center}.role{min-width:0;border-radius:20px;padding:13px 8px;background:#f1f5f9}.role small{display:block;font-size:clamp(11px,1.3vw,13px);font-weight:700;color:#64748b;white-space:nowrap}.role b{display:block;margin-top:4px;font-size:clamp(23px,2.4vw,30px);line-height:1.05;overflow-wrap:anywhere}.subject{background:#dcfce7;color:#166534}.object{background:#ffedd5;color:#9a3412}.subject b{color:#166534}.object b{color:#9a3412}button{cursor:pointer;transition:.15s transform;touch-action:manipulation}button:active{transform:scale(.96)}.listen{display:block;margin:18px auto 0;border:2px solid #e2e8f0;border-radius:999px;background:white;color:#475569;padding:11px 18px;font:inherit;font-size:17px;box-shadow:0 6px 14px #0001}.btn{border:0;border-radius:28px;padding:18px 28px;font:inherit;font-size:24px;font-weight:700;box-shadow:0 14px 25px #0002}.primary{background:var(--blue);color:white}.green{background:var(--green);color:white}.orange{background:var(--orange);color:white}.center{text-align:center}.bigcard{text-align:center;background:white;border-radius:42px;padding:32px;box-shadow:0 18px 40px #0001}.sentence{font-size:clamp(30px,7vw,52px);font-weight:700;line-height:1.08}.translation{margin-top:14px;color:var(--muted);font-size:clamp(20px,4vw,28px)}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}.option-emoji{display:block;font-size:54px;margin-bottom:6px}.feedback{min-height:48px;text-align:center;color:var(--blue);font-size:34px;font-weight:700}.badge{display:inline-flex;align-items:center;justify-content:center;color:white;font-size:25px;font-weight:700;padding:16px 24px;box-shadow:0 10px 20px #0002}.badge.subject{background:var(--green);border-radius:999px}.badge.object{background:var(--orange);border-radius:22px}.final{min-height:65vh;display:grid;place-items:center;text-align:center}.cup{font-size:120px}@media(max-width:720px){main{padding:22px 14px}.word{grid-template-columns:1fr}.emoji{font-size:54px}.card{padding:20px}.roles{gap:10px}.role{padding:12px 7px}}@media(max-width:420px){.roles{grid-template-columns:1fr}.btn{font-size:21px;padding:16px 20px}.bar{padding:12px}.stars{font-size:27px}}
</style>
</head>
<body>
<header><div class="bar"><div class="stars"><span class="starbox">★</span><span id="stars">0</span></div><h1>LATINO FACILE</h1><button class="reset" id="reset">↻</button></div></header>
<main id="app"></main>
<script>
const words=[['boy','IL RAGAZZO','PUER','PUERUM','👦'],['girl','LA RAGAZZA','PUELLA','PUELLAM','👧'],['apple','LA MELA','MALUM','MALUM','🍎'],['water',"L'ACQUA",'AQUA','AQUAM','💧'],['cat','IL GATTO','FELES','FELEM','🐱'],['rose','LA ROSA','ROSA','ROSAM','🌹'],['dog','IL CANE','CANIS','CANEM','🐶']].map(x=>({id:x[0],it:x[1],nom:x[2],acc:x[3],emoji:x[4]}));
const identify=[['PUER MALUM EDIT','IL RAGAZZO MANGIA LA MELA','PUER','👦','MALUM','🍎','PUER','👦 🍎 🍽️'],['PUELLA AQUAM BIBIT',"LA RAGAZZA BEVE L'ACQUA",'PUELLA','👧','AQUAM','💧','PUELLA','👧 💧 🥤'],['MARCUS PUERUM SALUTAT','MARCO SALUTA IL RAGAZZO','MARCUS','🙋','PUERUM','👦','MARCUS','🙋 👦 👋'],['FELES MARCUM VIDET','IL GATTO VEDE MARCO','FELES','🐱','MARCUM','🙋','FELES','🐱 🙋 👁️'],['JULIA ROSAM VIDET','GIULIA VEDE LA ROSA','ROSAM','🌹','JULIA','👩','JULIA','👩 🌹 👁️']].map(x=>({s:x[0],tr:x[1],a:x[2],ae:x[3],b:x[4],be:x[5],ok:x[6],se:x[7]}));
const examples={boy:[['CHI FA?','PUER RIDET','IL RAGAZZO RIDE','PUER'],['CHI SUBISCE?','MARCUS PUERUM SALUTAT','MARCO SALUTA IL RAGAZZO','PUERUM']],girl:[['CHI FA?','PUELLA CANTAT','LA RAGAZZA CANTA','PUELLA'],['CHI SUBISCE?','MARCUS PUELLAM AUDIT','MARCO SENTE LA RAGAZZA','PUELLAM']],apple:[['CHI FA?','MALUM CADIT','LA MELA CADE','MALUM'],['CHI SUBISCE?','PUER MALUM EDIT','IL RAGAZZO MANGIA LA MELA','MALUM']],water:[['CHI FA?','AQUA FLUIT',"L'ACQUA SCORRE",'AQUA'],['CHI SUBISCE?','PUELLA AQUAM BIBIT',"LA RAGAZZA BEVE L'ACQUA",'AQUAM']],cat:[['CHI FA?','FELES DORMIT','IL GATTO DORME','FELES'],['CHI SUBISCE?','MARCUS FELEM AMAT','MARCO AMA IL GATTO','FELEM']],rose:[['CHI FA?','ROSA FLORET','LA ROSA FIORISCE','ROSA'],['CHI SUBISCE?','MARCUS ROSAM VIDET','MARCO VEDE LA ROSA','ROSAM']],dog:[['CHI FA?','CANIS CURRIT','IL CANE CORRE','CANIS'],['CHI SUBISCE?','MARCUS CANEM AUDIT','MARCO SENTE IL CANE','CANEM']]};
const quiz=[['IL RAGAZZO MANGIA LA MELA','','MALUM EDIT','PUER','PUERUM','CHI FA?'],['MARCO SALUTA IL RAGAZZO','MARCUS SALUTAT','','PUERUM','PUER','CHI SUBISCE?'],["LA RAGAZZA BEVE L'ACQUA",'','AQUAM BIBIT','PUELLA','PUELLAM','CHI FA?'],["IL RAGAZZO BEVE L'ACQUA",'PUER BIBIT','','AQUAM','AQUA','CHI SUBISCE?'],['IL GATTO VEDE MARCO','','MARCUM VIDET','FELES','FELEM','CHI FA?'],['MARCO AMA IL GATTO','MARCUS AMAT','','FELEM','FELES','CHI SUBISCE?']].map(x=>({it:x[0],pre:x[1],post:x[2],ok:x[3],wrong:x[4],role:x[5]}));
let phase=0,i=0,stars=Number(localStorage.getItem('latin_stars')||0),feedback='';const app=document.getElementById('app'),starEl=document.getElementById('stars');function saveStars(){starEl.textContent=stars;localStorage.setItem('latin_stars',String(stars))}function addStar(){stars++;saveStars()}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.72;speechSynthesis.speak(u)}function btn(t,c,a){return`<button class="btn ${c}" data-action="${a}">${t}</button>`}function listen(t){return`<button class="listen" data-say="${encodeURIComponent(t)}">🔊 ASCOLTA</button>`}function render(){saveStars();if(phase===0)vocab();else if(phase===1)flash();else if(phase===2)identification();else if(phase===3)compare();else if(phase===4)discriminate();else done();bind()}
function vocab(){app.innerHTML=`<section class="screen"><div class="hero"><h2>CONOSCIAMO LE PAROLE</h2><p>GUARDA, LEGGI E ASCOLTA.</p></div><div class="grid">${words.map(w=>`<article class="card"><div class="word"><span class="emoji">${w.emoji}</span><div><div class="title">${w.it}</div><div class="roles"><div class="role subject"><small>CHI FA?</small><b>${w.nom}</b></div><div class="role object"><small>CHI SUBISCE?</small><b>${w.acc}</b></div></div>${listen(`${w.it}. ${w.nom}. ${w.acc}`)}</div></div></article>`).join('')}</div><div class="center">${btn('CONTINUA','primary','next')}</div></section>`}
function flash(){const w=words[i];app.innerHTML=`<section class="screen center"><div class="hero"><h2>FLASHCARD</h2></div><article class="bigcard"><div class="emoji">${w.emoji}</div><div class="sentence">${w.it}</div><div class="roles" style="margin-top:20px"><div class="role subject"><small>CHI FA?</small><b>${w.nom}</b></div><div class="role object"><small>CHI SUBISCE?</small><b>${w.acc}</b></div></div>${listen(`${w.it}. ${w.nom}. ${w.acc}`)}</article>${btn(i===words.length-1?'PASSA AGLI ESERCIZI':'AVANTI','primary','next')}</section>`}
function identification(){const q=identify[i];app.innerHTML=`<section class="screen center"><div class="hero"><h2>CHI FA L'AZIONE?</h2></div><article class="bigcard"><div class="emoji">${q.se}</div><div class="sentence">${q.s}</div><div class="translation">${q.tr}</div>${listen(`${q.s}. ${q.tr}`)}</article><div class="options"><button class="btn green" data-pick="${q.a}"><span class="option-emoji">${q.ae}</span>${q.a}</button><button class="btn orange" data-pick="${q.b}"><span class="option-emoji">${q.be}</span>${q.b}</button></div><div class="feedback">${feedback}</div></section>`}
function compare(){const w=words[i],ex=examples[w.id];app.innerHTML=`<section class="screen center"><div class="hero"><h2>CONFRONTA LE FORME</h2></div><div class="emoji">${w.emoji}</div><div class="grid">${ex.map(e=>`<article class="card center"><div class="badge ${e[0]==='CHI FA?'?'subject':'object'}">${e[0]}</div><div class="sentence" style="margin-top:16px">${e[3]}</div><div class="translation">${e[1]}</div><p>${e[2]}</p>${listen(`${e[1]}. ${e[2]}`)}</article>`).join('')}</div>${btn(i===words.length-1?'FACCIAMO IL QUIZ':'AVANTI','primary','next')}</section>`}
function discriminate(){const q=quiz[i],ops=i%2?[q.wrong,q.ok]:[q.ok,q.wrong];app.innerHTML=`<section class="screen center"><div class="hero"><h2>SCEGLI LA FORMA</h2></div><article class="bigcard"><div class="badge ${q.role==='CHI FA?'?'subject':'object'}">${q.role}</div><div class="translation">${q.it}</div><div class="sentence" style="margin-top:18px">${q.pre} <span style="background:#fef9c3;border-radius:18px;padding:4px 18px">?</span> ${q.post}</div>${listen(q.it)}</article><div class="options">${ops.map(o=>`<button class="btn primary" data-pick="${o}">${o}</button>`).join('')}</div><div class="feedback">${feedback}</div></section>`}
function done(){app.innerHTML=`<section class="final"><div><div class="cup">🏆</div><h2 class="sentence">OTTIMO LAVORO!</h2><p class="translation">HAI VINTO ${stars} STELLE!</p>${btn('GIOCA ANCORA','primary','restart')}</div></section>`}function next(){addStar();feedback='';if(phase===0){phase=1;i=0}else if(phase===1&&i<words.length-1)i++;else if(phase===1){phase=2;i=0}else if(phase===3&&i<words.length-1)i++;else if(phase===3){phase=4;i=0}render()}function pick(v){const q=phase===2?identify[i]:quiz[i];if(v===q.ok){addStar();feedback='GIUSTO!';render();setTimeout(()=>{feedback='';if(phase===2&&i<identify.length-1)i++;else if(phase===2){phase=3;i=0}else if(phase===4&&i<quiz.length-1)i++;else if(phase===4){phase=5;i=0}render()},650)}else{feedback='RIPROVA';render()}}function bind(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.say)));document.querySelectorAll('[data-action="next"]').forEach(b=>b.onclick=next);document.querySelectorAll('[data-action="restart"]').forEach(b=>b.onclick=()=>{phase=0;i=0;stars=0;feedback='';saveStars();render()});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick))}document.getElementById('reset').onclick=()=>{phase=0;i=0;stars=0;feedback='';saveStars();render()};render();
</script>
</body>
</html>
