        theme: {
          extend: {
            fontFamily: {
              sans: ['Fredoka', 'sans-serif'],
              display: ['Fredoka', 'sans-serif'],

            colors: {
              'soft-blue': '#E0F2FE',
              'soft-green': '#DCFCE7',
              'soft-yellow': '#FEF9C3',

    <style>

        user-select: none;

      .shape-subject { border-radius: 9999px; }

      @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }
      .animate-pop { animation: pop 0.4s ease-out; }
