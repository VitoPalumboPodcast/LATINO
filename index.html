<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>LATINO INCLUSIVO</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0284c7;--green:#16a34a;--orange:#ea580c;--slate:#1e293b;--muted:#64748b;--soft:#f8fafc;--yellow:#facc15}*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;min-height:100vh;background:var(--soft);font-family:Fredoka,Arial,sans-serif;color:var(--slate);text-transform:uppercase}
header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:4px solid #e2e8f0;box-shadow:0 8px 20px #0001}.bar{max-width:980px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.stars{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700}.starbox{background:var(--yellow);color:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 8px 16px #facc1540}h1{margin:0;color:#94a3b8;font-size:clamp(22px,5vw,34px);text-align:center}.reset,.home{border:0;border-radius:18px;padding:12px 15px;background:#f1f5f9;color:#64748b;font:inherit;font-weight:700}
main{max-width:980px;margin:auto;padding:28px 18px 46px}.screen{display:grid;gap:24px}.hero{text-align:center}.hero h2{margin:0 0 10px;font-size:clamp(34px,7vw,58px);line-height:1;color:#172033}.hero p{margin:0;color:var(--muted);font-size:clamp(19px,4vw,27px)}
.grid,.modulegrid,.theorygrid,.options{display:grid;gap:20px}.grid{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));align-items:stretch}.modulegrid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.theorygrid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.options{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card,.module,.theory,.examplebox,.bigcard{min-width:0;background:white;border-radius:30px;padding:24px;box-shadow:0 16px 35px #0001;border-bottom:8px solid #e2e8f0;overflow:hidden}.module{text-align:left}.module h3{margin:0 0 10px;font-size:31px;color:#172033}.module p{margin:0 0 18px;color:var(--muted);font-size:19px;line-height:1.25;text-transform:none}.module ul{margin:0 0 22px;padding-left:22px;color:#475569;font-weight:700;line-height:1.5}
.theory{text-align:center}.theory .ico{font-size:56px;line-height:1;margin-bottom:10px}.theory h3{margin:0 0 8px;font-size:25px;color:#172033}.theory p{margin:0;color:#475569;font-size:20px;line-height:1.25;text-transform:none}.examplebox{text-align:center}.examplebox strong{display:block;font-size:clamp(28px,6vw,45px);color:#172033}.examplebox span{display:inline-block;margin:8px 5px 0;padding:10px 14px;border-radius:16px;font-size:20px;font-weight:700}
.word{display:grid;grid-template-columns:76px minmax(0,1fr);gap:18px;align-items:center}.emoji{font-size:58px;line-height:1;text-align:center}.title{font-size:clamp(27px,3vw,32px);font-weight:700;color:#172033;margin-bottom:14px;text-align:center}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:center}.role{min-width:0;border-radius:20px;padding:13px 8px;background:#f1f5f9}.role small{display:block;font-size:12px;font-weight:700;color:#64748b;white-space:nowrap}.role b{display:block;margin-top:4px;font-size:clamp(20px,2vw,27px);line-height:1.05;white-space:nowrap}.subject{background:#dcfce7;color:#166534}.object{background:#ffedd5;color:#9a3412}.subject b{color:#166534}.object b{color:#9a3412}
button{cursor:pointer;transition:.15s transform;touch-action:manipulation}button:active{transform:scale(.96)}.listen{display:block;margin:18px auto 0;border:2px solid #e2e8f0;border-radius:999px;background:white;color:#475569;padding:11px 18px;font:inherit;font-size:17px;box-shadow:0 6px 14px #0001}.btn{border:0;border-radius:28px;padding:18px 28px;font:inherit;font-size:24px;font-weight:700;box-shadow:0 14px 25px #0002}.primary{background:var(--blue);color:white}.green{background:var(--green);color:white}.orange{background:var(--orange);color:white}.center{text-align:center}
.bigcard{text-align:center;border-radius:42px;padding:32px}.sentence{font-size:clamp(30px,7vw,52px);font-weight:700;line-height:1.12}.translation{margin-top:14px;color:var(--muted);font-size:clamp(20px,4vw,28px)}.latin-line{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}.missing{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:122px;min-height:82px;padding:10px 16px;border:4px dashed var(--yellow);background:#fef9c3;border-radius:22px;color:#854d0e;box-shadow:inset 0 0 0 3px #fff8}.missing .q{font-size:38px;line-height:1;font-weight:700}.missing .label{margin-top:4px;font-size:13px;font-weight:700;white-space:nowrap}.latin-token{white-space:nowrap}.option-emoji{display:block;font-size:54px;margin-bottom:6px}.feedback{min-height:48px;text-align:center;color:var(--blue);font-size:34px;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;color:white;font-size:25px;font-weight:700;padding:16px 24px;box-shadow:0 10px 20px #0002}.badge.subject{background:var(--green);border-radius:999px}.badge.object{background:var(--orange);border-radius:22px}.family{display:inline-block;margin-bottom:14px;padding:9px 18px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-weight:700}.note{display:inline-block;margin-top:15px;background:#fef3c7;color:#92400e;border-radius:16px;padding:10px 14px;font-weight:700}.casegrid{margin-top:22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.case{background:#f8fafc;border:2px solid #e2e8f0;border-radius:17px;padding:10px}.case small{display:block;color:#64748b;font-weight:700}.case b{display:block;font-size:22px;color:#172033;white-space:nowrap}.final{min-height:65vh;display:grid;place-items:center;text-align:center}.cup{font-size:120px}
@media(max-width:720px){main{padding:22px 14px}.grid,.modulegrid,.theorygrid{grid-template-columns:1fr}.word{grid-template-columns:1fr}.emoji{font-size:54px}.card,.module,.theory{padding:20px}.roles{gap:10px}.role{padding:12px 7px}.casegrid{grid-template-columns:1fr}}@media(max-width:460px){.roles{grid-template-columns:1fr}.btn{font-size:21px;padding:16px 20px}.bar{padding:12px}.stars{font-size:27px}.role b{font-size:26px}.latin-line{gap:10px}.missing{min-width:110px;min-height:74px}}
</style>
</head>
<body>
<header><div class="bar"><button class="home" id="home">MODULI</button><div class="stars"><span class="starbox">&#9733;</span><span id="stars">0</span></div><h1>LATINO FACILE</h1><button class="reset" id="reset">&#8635;</button></div></header>
<main id="app"></main>
<script>
const pic={boy:'&#128102;',girl:'&#128103;',apple:'&#127822;',water:'&#128167;',cat:'&#128049;',rose:'&#127801;',dog:'&#128054;',wolf:'&#128058;',tree:'&#127826;',temple:'&#127963;',sail:'&#9973;',star:'&#9733;',crown:'&#9819;',hand:'&#129330;',puzzle:'&#129513;',tag:'&#127991;',green:'&#128994;',orange:'&#128992;',listen:'&#128266;',cup:'&#127942;'};
const baseWords=[['boy','IL RAGAZZO','PUER','PUERUM',pic.boy],['girl','LA RAGAZZA','PUELLA','PUELLAM',pic.girl],['apple','LA MELA','MALUM','MALUM',pic.apple],['water',"L'ACQUA",'AQUA','AQUAM',pic.water],['cat','IL GATTO','FELES','FELEM',pic.cat],['rose','LA ROSA','ROSA','ROSAM',pic.rose],['dog','IL CANE','CANIS','CANEM',pic.dog]].map(x=>({id:x[0],it:x[1],nom:x[2],acc:x[3],emoji:x[4]}));
const advWords=[
{id:'girl',it:'LA RAGAZZA',nom:'PUELLA',acc:'PUELLAM',emoji:pic.girl,family:'SQUADRA A',gender:'FEMMINILE',note:'PRIMA DECLINAZIONE',cases:[['NOMINATIVO','CHI FA?','PUELL-A'],['GENITIVO','DI CHI?','PUELL-AE'],['DATIVO','A CHI?','PUELL-AE'],['ACCUSATIVO','CHI/COSA?','PUELL-AM'],['VOCATIVO','EHI!','PUELL-A'],['ABLATIVO','CON CHI?','PUELL-A']]},
{id:'wolf',it:'IL LUPO',nom:'LUPUS',acc:'LUPUM',emoji:pic.wolf,family:'SQUADRA B',gender:'MASCHILE',note:'SECONDA DECLINAZIONE',cases:[['NOMINATIVO','CHI FA?','LUP-US'],['GENITIVO','DI CHI?','LUP-I'],['DATIVO','A CHI?','LUP-O'],['ACCUSATIVO','CHI/COSA?','LUP-UM'],['VOCATIVO','EHI!','LUP-E'],['ABLATIVO','CON CHI?','LUP-O']]},
{id:'cherry',it:'IL CILIEGIO',nom:'CERASUS',acc:'CERASUM',emoji:pic.tree,family:'SQUADRA B',gender:'FEMMINILE',note:'GLI ALBERI SONO FEMMINE',cases:[['NOMINATIVO','CHI FA?','CERAS-US'],['GENITIVO','DI CHI?','CERAS-I'],['DATIVO','A CHI?','CERAS-O'],['ACCUSATIVO','CHI/COSA?','CERAS-UM'],['VOCATIVO','EHI!','CERAS-E'],['ABLATIVO','CON CHI?','CERAS-O']]},
{id:'boy',it:'IL RAGAZZO',nom:'PUER',acc:'PUERUM',emoji:pic.boy,family:'SQUADRA B',gender:'MASCHILE',note:'FORMA SPECIALE SENZA -US',cases:[['NOMINATIVO','CHI FA?','PUER'],['GENITIVO','DI CHI?','PUER-I'],['DATIVO','A CHI?','PUER-O'],['ACCUSATIVO','CHI/COSA?','PUER-UM'],['VOCATIVO','EHI!','PUER'],['ABLATIVO','CON CHI?','PUER-O']]},
{id:'temple',it:'IL TEMPIO',nom:'TEMPLUM',acc:'TEMPLUM',emoji:pic.temple,family:'SQUADRA B',gender:'NEUTRO',note:'NEUTRO: NOMINATIVO E ACCUSATIVO UGUALI',cases:[['NOMINATIVO','CHI FA?','TEMPL-UM'],['GENITIVO','DI CHI?','TEMPL-I'],['DATIVO','A CHI?','TEMPL-O'],['ACCUSATIVO','CHI/COSA?','TEMPL-UM'],['VOCATIVO','EHI!','TEMPL-UM'],['ABLATIVO','CON CHI?','TEMPL-O']]}];
const baseIdentify=[['PUER MALUM EDIT','IL RAGAZZO MANGIA LA MELA','PUER',pic.boy,'MALUM',pic.apple,'PUER',pic.boy+' '+pic.apple],['PUELLA AQUAM BIBIT',"LA RAGAZZA BEVE L'ACQUA",'PUELLA',pic.girl,'AQUAM',pic.water,'PUELLA',pic.girl+' '+pic.water],['MARCUS PUERUM SALUTAT','MARCO SALUTA IL RAGAZZO','MARCUS','&#128587;','PUERUM',pic.boy,'MARCUS','&#128587; '+pic.boy],['FELES MARCUM VIDET','IL GATTO VEDE MARCO','FELES',pic.cat,'MARCUM','&#128587;','FELES',pic.cat+' &#128587;'],['JULIA ROSAM VIDET','GIULIA VEDE LA ROSA','ROSAM',pic.rose,'JULIA','&#128105;','JULIA','&#128105; '+pic.rose]];
const advIdentify=[['LUPUS PUERUM TERRET','IL LUPO SPAVENTA IL RAGAZZO','LUPUS',pic.wolf,'PUERUM',pic.boy,'LUPUS',pic.wolf+' '+pic.boy],['PUELLA ROSAM TENET','LA RAGAZZA TIENE LA ROSA','PUELLA',pic.girl,'ROSAM',pic.rose,'PUELLA',pic.girl+' '+pic.rose],['PUER TEMPLUM VIDET','IL RAGAZZO VEDE IL TEMPIO','PUER',pic.boy,'TEMPLUM',pic.temple,'PUER',pic.boy+' '+pic.temple],['NAUTA PUELLAM AMAT','IL MARINAIO AMA LA RAGAZZA','NAUTA',pic.sail,'PUELLAM',pic.girl,'NAUTA',pic.sail+' '+pic.girl],['PUELLA LUPUM TIMET','LA RAGAZZA TEME IL LUPO','PUELLA',pic.girl,'LUPUM',pic.wolf,'PUELLA',pic.girl+' '+pic.wolf]];
const baseExamples={boy:[['CHI FA?','PUER RIDET','IL RAGAZZO RIDE','PUER'],['CHI SUBISCE?','MARCUS PUERUM SALUTAT','MARCO SALUTA IL RAGAZZO','PUERUM']],girl:[['CHI FA?','PUELLA CANTAT','LA RAGAZZA CANTA','PUELLA'],['CHI SUBISCE?','MARCUS PUELLAM AUDIT','MARCO SENTE LA RAGAZZA','PUELLAM']],apple:[['CHI FA?','MALUM CADIT','LA MELA CADE','MALUM'],['CHI SUBISCE?','PUER MALUM EDIT','IL RAGAZZO MANGIA LA MELA','MALUM']],water:[['CHI FA?','AQUA FLUIT',"L'ACQUA SCORRE",'AQUA'],['CHI SUBISCE?','PUELLA AQUAM BIBIT',"LA RAGAZZA BEVE L'ACQUA",'AQUAM']],cat:[['CHI FA?','FELES DORMIT','IL GATTO DORME','FELES'],['CHI SUBISCE?','MARCUS FELEM AMAT','MARCO AMA IL GATTO','FELEM']],rose:[['CHI FA?','ROSA FLORET','LA ROSA FIORISCE','ROSA'],['CHI SUBISCE?','MARCUS ROSAM VIDET','MARCO VEDE LA ROSA','ROSAM']],dog:[['CHI FA?','CANIS CURRIT','IL CANE CORRE','CANIS'],['CHI SUBISCE?','MARCUS CANEM AUDIT','MARCO SENTE IL CANE','CANEM']]};
const advExamples={girl:[['CHI FA?','PUELLA RIDET','LA RAGAZZA RIDE','PUELLA'],['CHI SUBISCE?','NAUTA PUELLAM VIDET','IL MARINAIO VEDE LA RAGAZZA','PUELLAM']],wolf:[['CHI FA?','LUPUS ULULAT','IL LUPO ULULA','LUPUS'],['CHI SUBISCE?','PUER LUPUM VIDET','IL RAGAZZO VEDE IL LUPO','LUPUM']],cherry:[['CHI FA?','CERASUS FLORET','IL CILIEGIO FIORISCE','CERASUS'],['CHI SUBISCE?','PUELLA CERASUM VIDET','LA RAGAZZA VEDE IL CILIEGIO','CERASUM']],boy:[['CHI FA?','PUER LUDIT','IL RAGAZZO GIOCA','PUER'],['CHI SUBISCE?','LUPUS PUERUM TERRET','IL LUPO SPAVENTA IL RAGAZZO','PUERUM']],temple:[['CHI FA?','TEMPLUM PULCHRUM EST','IL TEMPIO E BELLO','TEMPLUM'],['CHI SUBISCE?','NAUTA TEMPLUM VIDET','IL MARINAIO VEDE IL TEMPIO','TEMPLUM']]};
const baseQuiz=[['IL RAGAZZO MANGIA LA MELA','','MALUM EDIT','PUER','PUERUM','CHI FA?'],['MARCO SALUTA IL RAGAZZO','MARCUS SALUTAT','','PUERUM','PUER','CHI SUBISCE?'],["LA RAGAZZA BEVE L'ACQUA",'','AQUAM BIBIT','PUELLA','PUELLAM','CHI FA?'],["IL RAGAZZO BEVE L'ACQUA",'PUER BIBIT','','AQUAM','AQUA','CHI SUBISCE?'],['IL GATTO VEDE MARCO','','MARCUM VIDET','FELES','FELEM','CHI FA?'],['MARCO AMA IL GATTO','MARCUS AMAT','','FELEM','FELES','CHI SUBISCE?']];
const advQuiz=[['IL LUPO VEDE IL RAGAZZO','','PUERUM VIDET','LUPUS','LUPUM','CHI FA?'],['LA RAGAZZA VEDE IL LUPO','PUELLA','','LUPUM','LUPUS','CHI SUBISCE?'],['IL RAGAZZO CHIAMA LA RAGAZZA','PUER','','PUELLAM','PUELLA','CHI SUBISCE?'],['IL MARINAIO LODA LA RAGAZZA','','PUELLAM LAUDAT','NAUTA','NAUTAM','CHI FA?'],['LA RAGAZZA VEDE IL TEMPIO','PUELLA','','TEMPLUM','TEMPLUS','CHI SUBISCE?'],['IL LUPO SPAVENTA LE RAGAZZE','LUPUS','','PUELLAS','PUELLAE','CHI SUBISCE?']];
const modules={base:{name:'MODULO 1',title:'PAROLE E RUOLI',subtitle:'Livello base',theory:[[pic.crown,'CHI FA?','E la parola che compie l azione.'],[pic.hand,'CHI SUBISCE?','E la parola che riceve l azione.'],[pic.puzzle,'LA FORMA CAMBIA','In latino la parola cambia forma quando cambia ruolo.']],example:['PUER MALUM EDIT','PUER = chi fa','MALUM = chi subisce'],words:baseWords,identify:baseIdentify,examples:baseExamples,quiz:baseQuiz},advanced:{name:'MODULO 2',title:'DECLINAZIONI',subtitle:'Livello avanzato',theory:[[pic.tag,'IL CASO','Il caso dice che lavoro fa la parola nella frase.'],[pic.green,'NOMINATIVO','Di solito indica chi fa l azione.'],[pic.orange,'ACCUSATIVO','Di solito indica chi riceve l azione.']],example:['LUPUS PUERUM VIDET','LUPUS = nominativo','PUERUM = accusativo'],words:advWords,identify:advIdentify,examples:advExamples,quiz:advQuiz}};
let current=null,phase=-1,i=0,stars=Number(localStorage.getItem('latin_stars')||0),feedback='';const app=document.getElementById('app'),starEl=document.getElementById('stars');
function saveStars(){starEl.textContent=stars;localStorage.setItem('latin_stars',String(stars))}function addStar(){stars++;saveStars()}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='it-IT';u.rate=.72;speechSynthesis.speak(u)}function btn(t,c,a){return`<button class="btn ${c}" data-action="${a}">${t}</button>`}function listen(t){return`<button class="listen" data-say="${encodeURIComponent(t)}">${pic.listen} ASCOLTA</button>`}function data(){return modules[current]}
function render(){saveStars();if(phase<0)menu();else if(phase===0)theory();else if(phase===1)vocab();else if(phase===2)flash();else if(phase===3)identification();else if(phase===4)compare();else if(phase===5)discriminate();else done();bind()}
function menu(){app.innerHTML=`<section class="screen"><div class="hero"><h2>SCEGLI IL MODULO</h2><p>PARTI DAL LIVELLO PIU ADATTO.</p></div><div class="modulegrid"><article class="module"><span class="family">MODULO 1</span><h3>PAROLE E RUOLI</h3><p>Per riconoscere chi fa l'azione e chi la subisce con parole concrete.</p><ul><li>Lessico quotidiano</li><li>Frasi brevi</li><li>Teoria molto semplice</li></ul>${btn('INIZIA','primary','module:base')}</article><article class="module"><span class="family">MODULO 2</span><h3>DECLINAZIONI</h3><p>Per aggiungere casi, genere, neutro e forme della prima e seconda declinazione.</p><ul><li>Tabella dei casi</li><li>Note grammaticali</li><li>Teoria guidata</li></ul>${btn('INIZIA','green','module:advanced')}</article></div></section>`}
function theory(){const d=data();app.innerHTML=`<section class="screen"><div class="hero"><h2>PRIMA CAPIAMO</h2><p>${d.name}. ${d.subtitle}.</p></div><div class="theorygrid">${d.theory.map(t=>`<article class="theory"><div class="ico">${t[0]}</div><h3>${t[1]}</h3><p>${t[2]}</p></article>`).join('')}</div><article class="examplebox"><strong>${d.example[0]}</strong><span class="subject">${d.example[1]}</span><span class="object">${d.example[2]}</span>${listen(`${d.example[0]}. ${d.example[1]}. ${d.example[2]}`)}</article><div class="center">${btn('HO CAPITO','primary','next')}</div></section>`}
function vocab(){const d=data();app.innerHTML=`<section class="screen"><div class="hero"><h2>${d.title}</h2><p>${d.subtitle}. GUARDA, LEGGI E ASCOLTA.</p></div><div class="grid">${d.words.map(w=>`<article class="card"><div class="word"><span class="emoji">${w.emoji}</span><div><div class="title">${w.it}</div>${w.family?`<div class="center"><span class="family">${w.family} - ${w.gender}</span></div>`:''}<div class="roles"><div class="role subject"><small>CHI FA?</small><b>${w.nom}</b></div><div class="role object"><small>CHI SUBISCE?</small><b>${w.acc}</b></div></div>${w.note?`<div class="center"><span class="note">${w.note}</span></div>`:''}${listen(`${w.it}. ${w.nom}. ${w.acc}`)}</div></div></article>`).join('')}</div><div class="center">${btn('CONTINUA','primary','next')}</div></section>`}
function flash(){const w=data().words[i],cases=w.cases?`<div class="casegrid">${w.cases.map(c=>`<div class="case"><small>${c[0]} - ${c[1]}</small><b>${c[2]}</b></div>`).join('')}</div>`:'';app.innerHTML=`<section class="screen center"><div class="hero"><h2>FLASHCARD</h2></div><article class="bigcard"><div class="emoji">${w.emoji}</div><div class="sentence">${w.it}</div>${w.family?`<span class="family">${w.family} - ${w.gender}</span>`:''}<div class="roles" style="margin-top:20px"><div class="role subject"><small>CHI FA?</small><b>${w.nom}</b></div><div class="role object"><small>CHI SUBISCE?</small><b>${w.acc}</b></div></div>${w.note?`<span class="note">${w.note}</span>`:''}${cases}${listen(`${w.it}. ${w.nom}. ${w.acc}`)}</article>${btn(i===data().words.length-1?'PASSA AGLI ESERCIZI':'AVANTI','primary','next')}</section>`}
function identification(){const q=data().identify[i];app.innerHTML=`<section class="screen center"><div class="hero"><h2>CHI FA L'AZIONE?</h2></div><article class="bigcard"><div class="emoji">${q[7]}</div><div class="sentence">${q[0]}</div><div class="translation">${q[1]}</div>${listen(`${q[0]}. ${q[1]}`)}</article><div class="options"><button class="btn green" data-pick="${q[2]}"><span class="option-emoji">${q[3]}</span>${q[2]}</button><button class="btn orange" data-pick="${q[4]}"><span class="option-emoji">${q[5]}</span>${q[4]}</button></div><div class="feedback">${feedback}</div></section>`}
function compare(){const w=data().words[i],ex=data().examples[w.id];app.innerHTML=`<section class="screen center"><div class="hero"><h2>CONFRONTA LE FORME</h2></div><div class="emoji">${w.emoji}</div><div class="grid">${ex.map(e=>`<article class="card center"><div class="badge ${e[0]==='CHI FA?'?'subject':'object'}">${e[0]}</div><div class="sentence" style="margin-top:16px">${e[3]}</div><div class="translation">${e[1]}</div><p>${e[2]}</p>${listen(`${e[1]}. ${e[2]}`)}</article>`).join('')}</div>${btn(i===data().words.length-1?'FACCIAMO IL QUIZ':'AVANTI','primary','next')}</section>`}
function discriminate(){const q=data().quiz[i],ops=i%2?[q[4],q[3]]:[q[3],q[4]],pre=q[1]?`<span class="latin-token">${q[1]}</span>`:'',post=q[2]?`<span class="latin-token">${q[2]}</span>`:'';app.innerHTML=`<section class="screen center"><div class="hero"><h2>SCEGLI LA FORMA</h2></div><article class="bigcard"><div class="badge ${q[5]==='CHI FA?'?'subject':'object'}">${q[5]}</div><div class="translation">${q[0]}</div><div class="sentence latin-line">${pre}<span class="missing"><span class="q">?</span><span class="label">MANCA QUI</span></span>${post}</div>${listen(q[0])}</article><div class="options">${ops.map(o=>`<button class="btn primary" data-pick="${o}">${o}</button>`).join('')}</div><div class="feedback">${feedback}</div></section>`}
function done(){app.innerHTML=`<section class="final"><div><div class="cup">${pic.cup}</div><h2 class="sentence">OTTIMO LAVORO!</h2><p class="translation">HAI VINTO ${stars} STELLE!</p>${btn('SCEGLI UN ALTRO MODULO','primary','menu')}</div></section>`}
function startModule(m){current=m;phase=0;i=0;feedback='';render()}function next(){addStar();feedback='';if(phase===0){phase=1;i=0}else if(phase===1){phase=2;i=0}else if(phase===2&&i<data().words.length-1)i++;else if(phase===2){phase=3;i=0}else if(phase===4&&i<data().words.length-1)i++;else if(phase===4){phase=5;i=0}render()}
function pick(v){const ok=phase===3?data().identify[i][6]:data().quiz[i][3];if(v===ok){addStar();feedback='GIUSTO!';render();setTimeout(()=>{feedback='';if(phase===3&&i<data().identify.length-1)i++;else if(phase===3){phase=4;i=0}else if(phase===5&&i<data().quiz.length-1)i++;else if(phase===5){phase=6;i=0}render()},650)}else{feedback='RIPROVA';render()}}
function bind(){document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.say)));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a.startsWith('module:'))startModule(a.split(':')[1]);else if(a==='next')next();else if(a==='menu'){phase=-1;i=0;feedback='';render()}});document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(b.dataset.pick))}
document.getElementById('reset').onclick=()=>{phase=current?0:-1;i=0;stars=0;feedback='';saveStars();render()};document.getElementById('home').onclick=()=>{phase=-1;i=0;feedback='';render()};render();
</script>
</body>
</html>
